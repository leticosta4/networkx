  push:
    branches: [main, '!flaky-r*', '!insert-mutations', '!track-flaky']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RANKING_PACKAGE: "pytest-ranking"

