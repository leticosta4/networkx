name: test regsmart

on:
  push:
    branches: [main, '!flaky-r*', '!insert-mutations', '!track-flaky']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGSMART_PACKAGE: "git+https://github.com/leticosta4/pytest-regsmart@6c135576b567d77a8f412693a058cbe67c9e8590"

